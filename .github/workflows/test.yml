name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # carbon is a SNAPSHOT dependency and is excluded so that every run
      # resolves the latest published build
      - name: Cache Maven/Clojars deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/carbon
          key: m2-${{ hashFiles('shadow-cljs.edn') }}
          restore-keys: m2-

      - run: npm ci

      - name: ClojureScript unit tests
        run: make test-cljs

      - name: Clojure unit tests
        run: make test-clj

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache Maven/Clojars deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/carbon
          key: m2-${{ hashFiles('shadow-cljs.edn') }}
          restore-keys: m2-

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run e2e tests
        run: make e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
